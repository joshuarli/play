[package]
name = "player-text-differential"
version = "0.0.0"
edition = "2024"
publish = false
description = "Differential harness: Play's FreeType/HarfBuzz text path against harfrust, skrifa, and zeno. Evidence only; not a workspace member."

[workspace]

