[package]
name = "player-audio"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[dependencies]
rusty_aac = { path = "../../vendor/rusty-aac", version = "=2.0.1", default-features = false }
player-media = { path = "../player-media" }
symphonia = { path = "../../vendor/symphonia/symphonia", default-features = false, features = [
    "aac",
    "alac",
    "flac",
    "mp3",
    "opus",
    "pcm",
    "vorbis",
    "opt-simd",
] }

[build-dependencies]
player-build = { path = "../player-build" }
