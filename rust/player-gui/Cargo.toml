[package]
name = "player-gui"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Rust-owned GUI playback host using the scheduler engine"

[[bin]]
name = "player-gui"
path = "src/main.rs"

[dependencies]
player-audio = { path = "../player-audio" }
player-display = { path = "../player-display" }
player-engine = { path = "../player-engine" }
player-ffi = { path = "../player-ffi" }
player-lua = { path = "../player-lua" }
player-output = { path = "../player-output" }

[build-dependencies]
player-build = { path = "../player-build" }
