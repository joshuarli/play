[package]
name = "player-swap"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "VO swap integration gate: engine frames into a real window"

[lib]
crate-type = ["rlib"]

[dependencies]
player-audio = { path = "../player-audio" }
player-display = { path = "../player-display" }
player-engine = { path = "../player-engine" }
player-output = { path = "../player-output" }

[build-dependencies]
player-build = { path = "../player-build" }

[features]
swap-gate = []

[[test]]
name = "swap"
path = "tests/swap.rs"
required-features = ["swap-gate"]
