[package]
name = "player-app"
version = "0.41.0"
edition = "2024"
description = "Rust application layer and player executable"

[lib]
name = "player_app"
path = "src/lib.rs"

[[bin]]
name = "player"
path = "src/main.rs"

[dependencies]
player-audio = { path = "../player-audio" }
player-core = { path = "../player-core" }
player-display = { path = "../player-display" }
player-engine = { path = "../player-engine" }
player-backend = { path = "../player-backend" }
player-overlay = { path = "../player-overlay" }
player-media = { path = "../player-media" }
player-output = { path = "../player-output" }
player-tui = { path = "../player-tui" }

[build-dependencies]
player-build = { path = "../player-build" }
