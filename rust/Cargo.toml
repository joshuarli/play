[workspace]
resolver = "2"
members = ["player-app", "player-ass", "player-audio", "player-build", "player-core", "player-display", "player-engine", "player-backend", "player-gui", "player-media", "player-output", "player-tui"]

[profile.dev]
opt-level = 2
incremental = false
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = false

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[patch.crates-io]
ruopus = { path = "../vendor/ruopus" }
