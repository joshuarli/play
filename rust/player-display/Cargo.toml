[package]
name = "player-display"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[lib]
crate-type = ["rlib"]

[features]
present-gate = []

[[test]]
name = "present"
path = "tests/present.rs"
required-features = ["present-gate"]

[target."cfg(target_os = \"linux\")".dependencies]
player-output = { path = "../player-output" }
wayland-client = { version = "=0.31.15", features = ["system"] }
wayland-protocols = { version = "=0.32.13", features = ["client"] }

[build-dependencies]
player-build = { path = "../player-build" }
