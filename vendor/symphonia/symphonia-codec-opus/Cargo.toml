[package]
name = "symphonia-codec-opus"
description = "Pure Opus decoder (a part of project Symphonia)."
authors = ["Philip Deljanov <philip.deljanov@gmail.com>"]
readme = "README.md"
categories = ["multimedia", "multimedia::audio", "multimedia::encoding"]
keywords = ["audio", "codec", "decoder", "opus"]
# Common package metadata located in workspace Cargo.toml.
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
log = { workspace = true }
ruopus = { version = "0.1.2", default-features = false, features = ["std"] }
symphonia-common = { version = "0.6.1", path = "../symphonia-common" }
symphonia-core = { version = "0.6.1", path = "../symphonia-core" }

[lints]
workspace = true
