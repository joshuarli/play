name: Linux

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      repeat:
        description: 'Suite repetitions'
        required: false
        default: '1'
      mode:
        description: 'gates, helgrind, or memcheck'
        required: false
        default: 'gates'

permissions: {}

concurrency:
  group: linux-${{ github.ref_name != 'main' && github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  ARTIFACT: player-x86_64-linux-musl.tar.gz

jobs:
  linux:
    name: Linux x86-64 musl
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .work/deps/linux
            .work/deps/player-linux/target
            .work/home/cargo
          key: player-linux-deps-${{ hashFiles('scripts/build-deps-linux.sh', 'scripts/build-ffmpeg.sh', 'scripts/ffmpeg-components.txt', 'docker/linux/Dockerfile', 'rust/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            player-linux-deps-

      - name: Build release tarball
        run: make linux

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Runner CPU
        run: |
          lscpu | sed -n '1,30p'
          nproc

      - name: Test
        if: inputs.mode != 'helgrind' && inputs.mode != 'memcheck'
        env:
          REPEAT: ${{ inputs.repeat || 1 }}
        run: |
          scripts/linux-container.sh tests/run.sh fixtures
          scripts/linux-container.sh python3 -c "import sys; sys.path.insert(0, 'tests'); import harness; harness.measure_fixture('1080p', 1920, 1080)"
          scripts/linux-container.sh scripts/debug-gate-loop.sh "$REPEAT" 2

      - name: Valgrind OSD
        if: inputs.mode == 'helgrind' || inputs.mode == 'memcheck'
        continue-on-error: true
        run: |
          scripts/linux-container.sh tests/run.sh fixtures
          chmod +x tests/debug-vg-mpv.sh
          PLAYER_VG_TOOL=${{ inputs.mode }} PLAYER_MPV=/work/tests/debug-vg-mpv.sh \
            PLAYER_TIMEOUT_SCALE=30 \
            scripts/linux-container.sh python3 tests/debug-helgrind.py

      - name: Valgrind reports
        if: inputs.mode == 'helgrind' || inputs.mode == 'memcheck'
        run: |
          log=".work/tmp/vg-${{ inputs.mode }}.log"
          if [ -f "$log" ]; then
            echo "log lines: $(wc -l < "$log")"
            grep -n -B6 -A40 -E 'ta\.c|Invalid (read|write)|uninitialised' "$log" | head -400 || true
          else
            echo "no valgrind log"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.mode == 'helgrind' || inputs.mode == 'memcheck'
        with:
          name: valgrind-${{ inputs.mode }}
          path: .work/tmp/vg-${{ inputs.mode }}.log
          if-no-files-found: warn

      - name: Verify tarball
        run: |
          cd dist
          sha256sum -c "$ARTIFACT.sha256"
          tar -tzf "$ARTIFACT" | sort | tr '\n' ' ' | grep -qx 'README player '

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: player-x86_64-linux-musl
          path: |
            dist/${{ env.ARTIFACT }}
            dist/${{ env.ARTIFACT }}.sha256
          if-no-files-found: error
